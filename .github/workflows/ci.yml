name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, schema and workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install host/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-host.txt -r requirements-dev.txt
      - name: Pytest
        run: pytest -q
      - name: Output catalogue and SHA-256 validation
        run: python pipeline/validate_outputs.py
      - name: Repository consistency audit
        run: python pipeline/audit_repo.py
      - name: Planner smoke test
        run: python pipeline/plan_analysis.py --source 3C120_z_0.0330 --goal auto
      - name: Statistical report regeneration
        run: python pipeline/statistical_report.py
      - name: Snakemake dry-run
        run: |
          snakemake -s workflow/Snakefile -n \
            --config sources=3C120_z_0.0330 tools=pyqsofit_uv,crossmission

  docker-smoke:
    name: Docker build (optical_linefit)
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -f Tools/optical_linefit/dockerfile -t optical_linefit .
