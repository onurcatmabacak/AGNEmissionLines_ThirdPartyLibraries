name: Publish images to GHCR

# Manual/tag-only.  This is the path to immutable registry digests; the CI
# workflow intentionally does not push images on every commit.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image matrix
        run: bash Pipelines/build_images.sh
      - name: Tag and push
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${owner}/agnemissionlines-thirdpartylibraries"
          tag="${GITHUB_REF_NAME//\//-}"
          tools="$(sed -n 's/^DOCKER_TOOLS=(\(.*\))/\1/p' Pipelines/build_images.sh)"
          : > image_digests.txt
          for tool in $tools; do
            image="ghcr.io/${repo}/${tool}:${tag}"
            docker tag "${tool}:latest" "$image"
            docker push "$image"
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
            echo "${tool}|${image}|${digest}" >> image_digests.txt
          done
          cat image_digests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: registry-digests
          path: image_digests.txt
